stages:
  validate:
    cmd: uv run --locked python -m src.validate_data
    deps:
      - src/validate_data.py
      - data/raw
      - uv.lock
      - pyproject.toml
    outs:
      - reports/data_quality.json:
          cache: false

  prepare:
    cmd: uv run --locked python -m src.prepare
    deps:
      - src/prepare.py
      - src/data.py
      - src/reproducibility.py
      - src/provenance.py
      - data/raw
      - reports/data_quality.json
      - uv.lock
      - pyproject.toml
    params:
      - data.image_size
      - train.random_state
    outs:
      - data/processed
      - reports/data_summary.json:
          cache: false

  train:
    cmd: uv run --locked python -m src.train
    deps:
      - src/train.py
      - src/model.py
      - src/data.py
      - src/reproducibility.py
      - src/provenance.py
      - data/processed
      - uv.lock
      - pyproject.toml
    params:
      - data.image_size
      - train
      - augmentation
      - compute
      - tracking
    outs:
      - models/model.pt
      - reports/training_curves.png:
          cache: false
      - reports/run_manifest.json:
          cache: false
    metrics:
      - reports/train_summary.json:
          cache: false
    
  evaluate:
    cmd: uv run --locked python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/data.py
      - src/reproducibility.py
      - data/processed/test
      - data/manifests
      - uv.lock
      - pyproject.toml
    params:
      - data.image_size
      - evaluation.batch_size
      - compute
      - tracking
      - selection.run_id
    metrics:
      - reports/test_metrics.json:
          cache: false
    outs:
      - reports/test_confusion_matrix.png:
          cache: false